<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE STICK MAN — a toon open-world stick-figure crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #79c7e3; touch-action: none; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Touch controls (smartphone mode): shown only when touch.js adds .mobile
     to <body>. Everything is thumb-sized, translucent, and touch-action:none
     so gestures never scroll or zoom the page. */
  #touchUI { display: none; }
  body.mobile #touchUI { display: block; }
  #touchUI * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stickZone { position: fixed; left: 0; bottom: 0; width: 55%; height: 62%; z-index: 5; }
  #stickBase { position: fixed; width: 112px; height: 112px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.55); background: rgba(10,14,24,0.28);
    transform: translate(-50%, -50%); display: none; z-index: 6; pointer-events: none; }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.55); border: 2px solid rgba(10,14,24,0.35);
    transform: translate(-50%, -50%); }
  #btns { position: fixed; right: 0; bottom: 0; width: 230px; height: 230px; z-index: 5;
    padding-bottom: env(safe-area-inset-bottom); }
  .tbtn { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55);
    background: rgba(10,14,24,0.45); color: #fff; font: 700 13px system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; }
  .tbtn.on { background: rgba(255,217,77,0.65); color: #17181c; }
  #btnUse { right: 18px; bottom: 22px; width: 86px; height: 86px; font-size: 14px; }
  #btnPunch { right: 118px; bottom: 26px; width: 68px; height: 68px; }
  #btnShoot { right: 26px; bottom: 120px; width: 68px; height: 68px; }
  #btnSprint { right: 118px; bottom: 108px; width: 56px; height: 56px; font-size: 11px; }
  #btnPause { position: fixed; top: calc(72px + env(safe-area-inset-top)); right: 12px; z-index: 6;
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55);
    background: rgba(10,14,24,0.45); color: #fff; font: 800 15px system-ui, sans-serif; }
  #tapBtn { position: fixed; left: 50%; bottom: 16%; transform: translateX(-50%); z-index: 7;
    padding: 17px 36px; border-radius: 999px; border: 3px solid #17181c;
    background: #ffd94d; color: #17181c; font: 800 23px system-ui, sans-serif; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="THE STICK MAN: explore the city of Palmera on foot and by car, run missions, dodge the police"></canvas>
<canvas id="hud"></canvas>
<div id="touchUI" aria-hidden="true">
  <div id="stickZone"></div>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="btns">
    <button class="tbtn" id="btnShoot" type="button">SHOOT</button>
    <button class="tbtn" id="btnSprint" type="button">SPRINT</button>
    <button class="tbtn" id="btnPunch" type="button">PUNCH</button>
    <button class="tbtn" id="btnUse" type="button">USE</button>
  </div>
  <button id="btnPause" type="button">| |</button>
  <button id="tapBtn" type="button">TAP TO START</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
